name: ton-price-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ton-price
  cancel-in-progress: false

jobs:
  post-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post price if changed
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python gh_price_once.py

      - name: Save last price
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add last_price.txt || true
          git diff --cached --quiet || (git commit -m "update price" && git push)
