name: TON Price Bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ton-price-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          # Install explicitly so both bot.py and the fallback have matplotlib.
          python -m pip install "matplotlib>=3.8,<4.0"

      - name: Restore previous bot state
        uses: actions/cache/restore@v4
        with:
          path: ton_state.json
          key: ton-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ton-state-${{ github.ref_name }}-

      - name: Run TON bot once
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "@Gram_Price_Today"
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          RUN_ONCE: "1"
          STATE_FILE: ton_state.json
          ALERT_USD: ${{ vars.ALERT_USD }}
        run: |
          if [ -f bot.py ]; then
            echo "Found bot.py; running enhanced bot."
            python -m py_compile bot.py
            python bot.py
          elif [ -f gh_price_once.py ]; then
            echo "bot.py is absent; using gh_price_once.py."
            python -m py_compile gh_price_once.py
            python gh_price_once.py
          else
            echo "ERROR: Neither bot.py nor gh_price_once.py exists in the repository root."
            find . -maxdepth 4 -type f -name '*.py' -print
            exit 1
          fi

      - name: Save previous bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ton_state.json
          key: ton-state-${{ github.ref_name }}-${{ github.run_id }}
