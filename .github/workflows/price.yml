name: TON Price Bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ton-price-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: ton_state.json
          key: ton-state-${{ github.run_id }}
          restore-keys: |
            ton-state-

      - name: Run TON price publisher
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          STATE_FILE: ton_state.json
          LOG_LEVEL: INFO
        run: python gh_price_once.py

      - name: Save bot state to repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ton_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ton_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update TON bot state"
              git push origin HEAD:${GITHUB_REF_NAME}
            fi
          fi
