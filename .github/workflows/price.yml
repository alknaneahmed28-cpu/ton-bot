name: TON Price Bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ton-price-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous bot state
        uses: actions/cache/restore@v4
        with:
          path: ton_state.json
          key: ton-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ton-state-${{ github.ref_name }}-

      - name: Run TON bot once
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          RUN_ONCE: "1"
          STATE_FILE: ton_state.json
        run: python gh_price_once.py

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ton_state.json
          key: ton-state-${{ github.ref_name }}-${{ github.run_id }}
